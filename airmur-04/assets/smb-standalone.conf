# AIRMUR 04 — configuración candidata del laboratorio
[global]
    map to guest = Never
    restrict anonymous = 2

[Operaciones]
    path = /srv/airmur/operaciones
    browseable = yes
    read only = yes
    guest ok = no
    valid users = @air_ops @air_security @air_it
    write list = @air_ops @air_it
    inherit acls = yes
    map acl inherit = yes

[Seguridad]
    path = /srv/airmur/seguridad
    browseable = yes
    read only = yes
    guest ok = no
    valid users = @air_ops @air_security @air_it
    write list = @air_security @air_it
    inherit acls = yes
    map acl inherit = yes

[Intercambio]
    path = /srv/airmur/intercambio
    browseable = yes
    read only = yes
    guest ok = no
    valid users = @air_ops @air_security @air_it
    write list = @air_ops @air_security @air_it
    inherit acls = yes
    map acl inherit = yes

[Evidencias]
    path = /srv/airmur/evidencias
    browseable = yes
    read only = yes
    guest ok = no
    valid users = @air_it
    write list = @air_it
    inherit acls = yes
    map acl inherit = yes

[AIRMUR-BOARDING]
    printable = yes
    printer name = AIRMUR-BOARDING
    browseable = yes
    guest ok = no
    valid users = @air_ops @air_security @air_it

